name: API Health Check

on:
  workflow_dispatch:
  schedule:
    # Every hour (UTC). Fail-only email via SEND_HEALTH_ALERT=1.
    - cron: "0 * * * *"

jobs:
  health:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      # SEND_HEALTH_ALERT=1: email only when checks fail (pass = green job, no mail).
      - name: Run API health checks
        env:
          TEST_ENV: prod
          SHUNYA_TEST_EMAIL: ${{ secrets.SHUNYA_TEST_EMAIL }}
          SHUNYA_TEST_PASSWORD: ${{ secrets.SHUNYA_TEST_PASSWORD }}
          SEND_HEALTH_ALERT: "1"
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_DASHBOARD_URL: https://shunyalabsai.github.io/widgets-automation
          REPORT_TIMEZONE: Asia/Kolkata
        run: npm run health:check

      - name: Upload health report artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: health-check-debug
          path: |
            reports/health-playwright-report.json
            reports/health-alert-run.json
            docs/data/latest-health.json
          if-no-files-found: ignore
