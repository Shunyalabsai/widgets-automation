name: Scheduled Widget Tests

on:
  workflow_dispatch:
  repository_dispatch:
    types: [cronitor-trigger]
  schedule:
    # 12:10 IST = 06:40 UTC
    - cron: "40 6 * * *"
    # 12:15 IST = 06:45 UTC (daily summary email)
    - cron: "45 6 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scheduled-pages"
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'schedule' || github.event.schedule != '45 6 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests and update dashboard
        id: run_tests
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: test-coverage
          DASHBOARD_BASE_URL: https://saira-uwc.github.io/Shunyalabs_widget
        run: |
          set +e
          npm test
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit dashboard updates
        if: always()
        run: |
          git add docs || true
          if ! git diff --cached --quiet; then
            git fetch origin "${GITHUB_REF_NAME}"
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
            git -c user.name="github-actions" -c user.email="github-actions@github.com" \
              commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Fail on test errors
        if: always()
        run: |
          exit "${{ steps.run_tests.outputs.exit_code }}"

  deploy:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  send-daily-email:
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' && github.event.schedule == '45 6 * * *'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Send daily email summary
        env:
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_PROJECT_NAME: Shunyalabs Widget Automation
          REPORT_DASHBOARD_URL: https://saira-uwc.github.io/Shunyalabs_widget
          REPORT_TIMEZONE: Asia/Kolkata
        run: node scripts/send-daily-report.js
