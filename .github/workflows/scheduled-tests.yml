name: Scheduled Widget Tests

on:
  workflow_dispatch:
  schedule:
    # 01:00 IST (UTC+5:30) = 19:30 UTC (previous day)
    - cron: "30 19 * * *"
    # 03:00 IST = 21:30 UTC
    - cron: "30 21 * * *"
    # 05:00 IST = 23:30 UTC
    - cron: "30 23 * * *"
    # 13:00 IST = 07:30 UTC
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run tests and update dashboard
        id: run_tests
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: test-coverage
          DASHBOARD_BASE_URL: https://saira-uwc.github.io/Shunyalabs_widget
        run: |
          set +e
          npm test
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit dashboard updates
        if: always()
        run: |
          git add docs reports test-results || true
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions" -c user.email="github-actions@github.com" \
              commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi

      - name: Fail on test errors
        if: always()
        run: |
          exit "${{ steps.run_tests.outputs.exit_code }}"
