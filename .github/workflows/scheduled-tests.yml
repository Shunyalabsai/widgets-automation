name: Scheduled Widget Tests (GAS)

on:
  workflow_dispatch:
    inputs:
      run_daily_resonance:
        description: Run Resonance daily demo callback E2E (morning slot)
        type: boolean
        default: false
  repository_dispatch:
    types: [run-tests]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scheduled-pages"
  cancel-in-progress: false

jobs:
  run-tests:
    # Playwright 1.58.x does not support ubuntu-latest (26.04) yet; use 24.04.
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Resolve daily E2E flags
        id: daily_e2e
        run: |
          RUN_DAILY_RESONANCE=0
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.run_daily_resonance }}" = "true" ]; then
            RUN_DAILY_RESONANCE=1
          fi
          if [ "${{ github.event_name }}" = "repository_dispatch" ] && [ "${{ github.event.client_payload.run_daily_resonance }}" = "true" ]; then
            RUN_DAILY_RESONANCE=1
          fi
          echo "run_daily_resonance=$RUN_DAILY_RESONANCE" >> "$GITHUB_OUTPUT"

      - name: Run tests and update dashboard
        id: run_tests
        env:
          TEST_ENV: prod
          RUN_DAILY_RESONANCE_E2E: ${{ steps.daily_e2e.outputs.run_daily_resonance }}
          SHUNYA_TEST_EMAIL: ${{ secrets.SHUNYA_TEST_EMAIL }}
          SHUNYA_TEST_PASSWORD: ${{ secrets.SHUNYA_TEST_PASSWORD }}
          CONTACT_AUTOMATION_SECRET: ${{ secrets.CONTACT_AUTOMATION_SECRET }}
          RESONANCE_AUTOMATION_SECRET: ${{ secrets.RESONANCE_AUTOMATION_SECRET }}
          RESONANCE_AUTOMATION_PHONE: ${{ secrets.RESONANCE_AUTOMATION_PHONE }}
          RESONANCE_CALLBACK_PATH: ${{ secrets.RESONANCE_CALLBACK_PATH }}
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: test-coverage
          DASHBOARD_BASE_URL: https://shunyalabsai.github.io/widgets-automation
        run: |
          set +e
          npm test
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit dashboard updates
        if: always()
        run: |
          git -c user.name="github-actions" -c user.email="github-actions@github.com" \
            add docs || true
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions" -c user.email="github-actions@github.com" \
              commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin "${GITHUB_REF_NAME}"
            git -c user.name="github-actions" -c user.email="github-actions@github.com" \
              rebase --autostash -X theirs origin/"${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload Pages artifact
        if: always()
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Send failure email report
        if: always() && steps.run_tests.outputs.exit_code != '0'
        env:
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_PROJECT_NAME: Shunyalabs Widget Automation
          REPORT_DASHBOARD_URL: https://shunyalabsai.github.io/widgets-automation
          REPORT_SHEET_URL: https://docs.google.com/spreadsheets/d/${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          REPORT_TIMEZONE: Asia/Kolkata
        run: node scripts/send-daily-report.js || true

      - name: Fail on test errors
        if: always() && steps.run_tests.outcome != 'skipped'
        run: |
          exit "${{ steps.run_tests.outputs.exit_code }}"

  deploy:
    runs-on: ubuntu-24.04
    needs: run-tests
    if: always()
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
