name: Scheduled Widget Tests (GAS)

on:
  workflow_dispatch:
  repository_dispatch:
    types: [run-tests, send-email]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "scheduled-pages"
  cancel-in-progress: false

jobs:
  run-tests:
    runs-on: ubuntu-latest
    if: github.event_name != 'repository_dispatch' || github.event.action != 'send-email'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright chromium
        if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system deps
        if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run tests and update dashboard
        id: run_tests
        env:
          GOOGLE_SHEETS_WEB_APP_URL: ${{ secrets.GOOGLE_SHEETS_WEB_APP_URL }}
          GOOGLE_SHEETS_SPREADSHEET_ID: ${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          GOOGLE_SHEETS_SHEET_NAME: test-coverage
          DASHBOARD_BASE_URL: https://saira-uwc.github.io/Shunyalabs_widget
        run: |
          set +e
          npm test
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Commit dashboard updates
        if: always()
        run: |
          git -c user.name="github-actions" -c user.email="github-actions@github.com" \
            add docs || true
          if ! git diff --cached --quiet; then
            git -c user.name="github-actions" -c user.email="github-actions@github.com" \
              commit -m "Update dashboard $(date -u +'%Y-%m-%d %H:%M UTC')"
            git fetch origin "${GITHUB_REF_NAME}"
            git -c user.name="github-actions" -c user.email="github-actions@github.com" \
              rebase --autostash -X theirs origin/"${GITHUB_REF_NAME}"
            git push
          fi

      - name: Upload Pages artifact
        if: always() && (github.event_name != 'repository_dispatch' || github.event.action != 'send-email')
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs

      - name: Fail on test errors
        if: always()
        run: |
          exit "${{ steps.run_tests.outputs.exit_code }}"

  deploy:
    runs-on: ubuntu-latest
    needs: run-tests
    if: always() && (github.event_name != 'repository_dispatch' || github.event.action != 'send-email')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  send-daily-email:
    runs-on: ubuntu-latest
    if: github.event_name == 'repository_dispatch' && github.event.action == 'send-email'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: saira-widgets
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Pull latest dashboard data
        run: git pull origin saira-widgets --rebase

      - name: Send daily email summary
        env:
          EMAIL_WEB_APP_URL: ${{ secrets.EMAIL_WEB_APP_URL }}
          REPORT_RECIPIENTS: ${{ secrets.REPORT_RECIPIENTS }}
          REPORT_PROJECT_NAME: Shunyalabs Widget Automation
          REPORT_DASHBOARD_URL: https://saira-uwc.github.io/Shunyalabs_widget
          REPORT_SHEET_URL: https://docs.google.com/spreadsheets/d/${{ secrets.GOOGLE_SHEETS_SPREADSHEET_ID }}
          REPORT_TIMEZONE: Asia/Kolkata
        run: node scripts/send-daily-report.js
